name: validate

on:
  push:
  pull_request:

jobs:
  config:
    name: looper config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the cron wrapper is zsh, the runner image is not, and its suite
      # refuses rather than skipping
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Validate agent + skill specs
        run: ./scripts/validate-looper-config.sh
      - name: Config validator itself (both directions)
        run: ./scripts/validate-looper-config.test.sh
      - name: Guardrail replay predicates (both directions)
        run: ./scripts/custodian-guardrails.test.sh
      - name: Skill spec lint (both directions)
        run: ./scripts/custodian-skill-lint.test.sh
      - name: Custodian phase-order log check (both directions)
        run: ./scripts/custodian-phase-order.test.sh
      - name: Custodian log recall check (both directions)
        run: ./scripts/custodian-log-recall.test.sh
      - name: DEBUG skill-body-ceiling baseline in pristine sandbox
        run: |
          set -x
          echo "=== git status before any copy ==="
          git status --porcelain
          echo "=== diff of the two files under test ==="
          git diff -- skills/loop-de-looper/SKILL.md scripts/skill-body-ceilings.tsv
          echo "=== live byte counts ==="
          wc -c skills/loop-de-looper/SKILL.md scripts/skill-body-ceilings.tsv
          echo "=== ceilings row ==="
          grep -n "loop-de-looper" scripts/skill-body-ceilings.tsv
          echo "=== CR count in working file ==="
          grep -c $'\r' skills/loop-de-looper/SKILL.md || true
          echo "=== git blob byte count ==="
          git show HEAD:skills/loop-de-looper/SKILL.md | wc -c
          echo "=== cmp working file vs blob ==="
          git show HEAD:skills/loop-de-looper/SKILL.md > /tmp/blob.md
          cmp skills/loop-de-looper/SKILL.md /tmp/blob.md || true
          echo "=== byte-level diff around it ==="
          diff <(od -c skills/loop-de-looper/SKILL.md) <(od -c /tmp/blob.md) | head -40
          temp_root=$(mktemp -d "${TMPDIR:-/tmp}/debug-mutkill.XXXXXX")
          pristine="$temp_root/pristine"
          mkdir -p "$pristine"
          cp -a scripts "$pristine/scripts"
          cp -a skills "$pristine/skills"
          [ -d local ] && cp -a local "$pristine/local"
          [ -d hooks ] && cp -a hooks "$pristine/hooks"
          [ -d agents ] && cp -a agents "$pristine/agents"
          ( cd "$pristine" && git init -q . && git -c user.email=mutkill@local -c user.name=mutkill commit -q --allow-empty -m sandbox )
          cd "$pristine"
          bash scripts/skill-body-ceiling.test.sh
      - name: Mutation-kill harness (both directions)
        run: ./scripts/custodian-mutation-kill.test.sh
      - name: Every declared mutant is killed by its suite
        run: ./scripts/custodian-mutation-kill.sh
      - name: Spec-load instrument (both directions)
        run: ./scripts/spec-load.test.sh
      - name: No entry point past its recorded spec-load baseline
        run: ./scripts/spec-load.sh --baseline scripts/spec-load-baseline.tsv
      - name: Skill body ceilings (both directions)
        run: ./scripts/skill-body-ceiling.test.sh
      - name: No skill body past its recorded ceiling
        run: ./scripts/skill-body-ceiling.sh
      - name: Execution receipts + writer hook (both directions)
        run: ./scripts/loop-receipts.test.sh
      - name: Loop run-state drift audit (both directions)
        run: ./scripts/loop-state-audit.test.sh
      - name: Loop finding admissibility audit (both directions)
        run: ./scripts/loop-finding-audit.test.sh
      - name: Doc-bloat detector (both directions)
        run: ./scripts/doc-bloat-scan.test.sh
      - name: Correction-gates runner (both directions)
        run: ./scripts/correction-gates/run-correction-gates.test.sh
      - name: Correction-gate format-scope (both directions)
        run: ./scripts/correction-gates/format-scope/gate.test.sh
      - name: Correction-gate no-ai-attribution (both directions)
        run: ./scripts/correction-gates/no-ai-attribution/gate.test.sh
      # CI has no wave scope, so every tracked file is the touched set
      - name: Correction gates live, under the pinned prettier
        run: |
          npm install -g "prettier@$(cat scripts/correction-gates/format-scope/prettier-version)"
          git ls-files '*.md' '*.yml' > "$RUNNER_TEMP/touched.txt"
          PRETTIER=prettier ./scripts/correction-gates/run-correction-gates.sh \
            --dir . --touched-from "$RUNNER_TEMP/touched.txt"
      - name: Destructive-git guard hook (both directions)
        run: ./hooks/guard-destructive-git.test.sh
      - name: PR-template guard hook (both directions)
        run: ./hooks/guard-pr-template.test.sh
      - name: Custodian cron run-start usage-window gate (both directions)
        run: ./scripts/looper-custodian-cron.test.sh
      - name: Usage-window probe emitted shapes (both directions)
        run: ./scripts/usage-window-probe.test.sh
      - name: Temp-dir guard across suites (both directions)
        run: ./scripts/temp-dir-guard.test.sh
